<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulario de suculenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/plantilla :: encabezado}"></header>

<main class="container py-5" style="max-width: 850px;">
    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4" th:text="${titulo}"></h1>

            <form th:action="${accion}" th:object="${suculenta}" method="post">
                <input type="hidden" th:field="*{idSuculenta}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombreComun" class="form-label">Nombre común</label>
                        <input id="nombreComun" type="text" class="form-control"
                               th:field="*{nombreComun}" maxlength="100" required>
                        <div class="text-danger small" th:errors="*{nombreComun}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="nombreCientifico" class="form-label">Nombre científico</label>
                        <input id="nombreCientifico" type="text" class="form-control"
                               th:field="*{nombreCientifico}" maxlength="150" required>
                        <div class="text-danger small" th:errors="*{nombreCientifico}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="familia" class="form-label">Familia</label>
                        <input id="familia" type="text" class="form-control"
                               th:field="*{familia}" maxlength="100" required>
                        <div class="text-danger small" th:errors="*{familia}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="colorPrincipal" class="form-label">Color principal</label>
                        <input id="colorPrincipal" type="text" class="form-control"
                               th:field="*{colorPrincipal}" maxlength="50" required>
                        <div class="text-danger small" th:errors="*{colorPrincipal}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="alturaCm" class="form-label">Altura (cm)</label>
                        <input id="alturaCm" type="number" min="1" class="form-control"
                               th:field="*{alturaCm}" required>
                        <div class="text-danger small" th:errors="*{alturaCm}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="precioEstimado" class="form-label">Precio estimado (₡)</label>
                        <input id="precioEstimado" type="number" min="0" step="0.01" class="form-control"
                               th:field="*{precioEstimado}" required>
                        <div class="text-danger small" th:errors="*{precioEstimado}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="nivelRiego" class="form-label">Nivel de riego</label>
                        <select id="nivelRiego" class="form-select" th:field="*{nivelRiego}" required>
                            <option value="">Seleccione...</option>
                            <option value="Bajo">Bajo</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Alto">Alto</option>
                        </select>
                        <div class="text-danger small" th:errors="*{nivelRiego}"></div>
                    </div>
                    <div class="col-12">
                        <label for="rutaImagen" class="form-label">URL de imagen alojada en la nube</label>
                        <input id="rutaImagen" type="url" class="form-control"
                               th:field="*{rutaImagen}" maxlength="500"
                               placeholder="https://..." required>
                        <div class="form-text">Pega un enlace directo a una imagen disponible en Internet.</div>
                        <div class="text-danger small" th:errors="*{rutaImagen}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/suculentas}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>
</html>
